
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Silvester Countdown</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

    /* Make page fill the screen and be touch-safe */
    html, body { height: 100%; width: 100%; margin: 0; }
    body { min-height: 100svh; background: #08140c; -webkit-font-smoothing:antialiased; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* App fills the viewport and centers content */
    #app {
      min-height: 100svh;
      height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 40px);
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg,#05060f 0%, #0b0b29 100%);
      border-radius: 0;
    }

  .stars {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--d) ease-in-out infinite var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--op); }
  }

  #title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(13px, 3vw, 18px);
    letter-spacing: 0.25em;
    color: #aab4cc;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    z-index: 2;
  }

  #year-label {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.05em;
    z-index: 2;
    line-height: 1;
    margin-bottom: 1.6rem;
    background: linear-gradient(135deg, #ffffff, #c8d8ff, #ffffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #units-row {
    display: flex;
    gap: clamp(8px, 2vw, 20px);
    z-index: 2;
    align-items: flex-end;
    flex-wrap: wrap;
    justify-content: center;
  }

  .unit-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .unit-num {
    font-family: 'Orbitron', monospace;
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 900;
    line-height: 1;
    min-width: 2ch;
    text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #7aa8ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 12px rgba(120,160,255,0.5));
    transition: color 0.2s;
  }
  .unit-num.pulse {
    animation: numPulse 0.3s ease;
  }
  @keyframes numPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .unit-label {
    font-family: 'Orbitron', monospace;
    font-size: clamp(9px, 1.5vw, 12px);
    letter-spacing: 0.2em;
    color: #5a6a99;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .sep {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 900;
    color: #2a3a66;
    margin-bottom: 24px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }

  #progress-wrap {
    width: min(720px, 94%);
    margin-top: 2rem;
    z-index: 2;
  }
  #progress-bar-bg {
    height: 4px;
    background: rgba(80,100,160,0.25);
    border-radius: 99px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4060cc, #a0b8ff);
    border-radius: 99px;
    transition: width 1s linear;
    box-shadow: 0 0 8px rgba(100,140,255,0.6);
  }
  #progress-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #3a4a77;
    text-align: right;
    margin-top: 6px;
  }

  /* FIREWORKS CANVAS */
  #fw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: none;
  }

  /* SOLAR SYSTEM BACKGROUND */
  #solar-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.9;
    mix-blend-mode: screen;
  }


  /* HAPPY NEW YEAR overlay */
  #hny {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 1rem;
  }
  #hny h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(24px, 6vw, 48px);
    font-weight: 900;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, #ffe066, #ffaacc, #66ccff, #aaff88);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowShift 2s linear infinite, scaleIn 0.6s ease;
  }
  @keyframes rainbowShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
  @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #hny p {
    font-family: 'Orbitron', monospace;
    font-size: clamp(12px, 2.5vw, 18px);
    color: #aac8ff;
    margin-top: 1rem;
    letter-spacing: 0.2em;
    animation: fadeIn 1s ease 0.5s both;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="solar-canvas" aria-hidden="true"></canvas>
  <div class="stars" id="stars"></div>
  <canvas id="fw-canvas"></canvas>
  <div id="hny">
    <h1 id="hny-year">Frohes neues Jahr!</h1>
    <p id="hny-sub">2027 :)</p>
  </div>
  <div id="counter-wrap" style="display:flex;flex-direction:column;align-items:center;z-index:2;width:100%;">
    <div id="title">Countdown bis Silvester</div>
    <div id="year-label">2026</div>
    <div id="units-row"></div>
    <div id="progress-wrap">
      <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
      <div id="progress-label">Jahr zu 0% verstrichen</div>
    </div>
  </div>
</div>

<script>
(function(){
  // Stars
  const starsEl = document.getElementById('stars');
  for(let i=0;i<90;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:-${Math.random()*5}s;--op:${0.3+Math.random()*0.7}`;
    starsEl.appendChild(s);
  }

  const unitsRow = document.getElementById('units-row');
  const progressBar = document.getElementById('progress-bar');
  const progressLabel = document.getElementById('progress-label');
  const fwCanvas = document.getElementById('fw-canvas');
  const hny = document.getElementById('hny');
  const counterWrap = document.getElementById('counter-wrap');
  const yearLabel = document.getElementById('year-label');
  const ctx = fwCanvas.getContext('2d');

  // normal runtime (no demo overrides)

  let prevValues = {};
  let fireworksActive = false;
  let particles = [];
  let animFrame = null;

  function getNextNewYear() {
    const now = new Date();
    let year = now.getFullYear();
    const ny = new Date(year + 1, 0, 1, 0, 0, 0, 0); // Jan 1 next year
    return ny;
  }

  function getYearStart() {
    const now = new Date();
    return new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
  }

  function pad(n) { return String(Math.max(0,n)).padStart(2,'0'); }

  function buildUnits(show) {
    // show: array of {key, label}
    unitsRow.innerHTML = '';
    show.forEach((u, i) => {
      if(i > 0) {
        const sep = document.createElement('div');
        sep.className = 'sep';
        sep.textContent = ':';
        unitsRow.appendChild(sep);
      }
      const block = document.createElement('div');
      block.className = 'unit-block';
      block.innerHTML = `<div class="unit-num" id="num-${u.key}">00</div><div class="unit-label">${u.label}</div>`;
      unitsRow.appendChild(block);
    });
  }

  function updateNum(key, val) {
    const el = document.getElementById('num-' + key);
    if(!el) return;
    if(el.textContent !== val) {
      el.textContent = val;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
  }

  function tick() {
    const now = new Date();
    const ny = getNextNewYear();
    const diff = ny - now;

    if(diff <= 0 && !fireworksActive) {
      startFireworks();
      return;
    }
    if(diff <= 0) return;

    const totalSecs = Math.floor(diff / 1000);
    const days = Math.floor(totalSecs / 86400);
    const hours = Math.floor((totalSecs % 86400) / 3600);
    const mins = Math.floor((totalSecs % 3600) / 60);
    const secs = totalSecs % 60;

    yearLabel.textContent = ny.getFullYear();

    // Determine display mode
    if(days >= 1) {
      // show days, hours, mins
      if(!document.getElementById('num-days')) buildUnits([{key:'days',label:'Tage'},{key:'hours',label:'Std'},{key:'mins',label:'Min'}]);
      updateNum('days', pad(days));
      updateNum('hours', pad(hours));
      updateNum('mins', pad(mins));
    } else if(hours >= 1) {
      // show hours, mins, secs
      if(!document.getElementById('num-hours') || document.getElementById('num-days')) buildUnits([{key:'hours',label:'Stunden'},{key:'mins',label:'Min'},{key:'secs',label:'Sek'}]);
      updateNum('hours', pad(hours));
      updateNum('mins', pad(mins));
      updateNum('secs', pad(secs));
    } else if(mins >= 1) {
      // show mins, secs only
      if(!document.getElementById('num-mins') || document.getElementById('num-hours')) buildUnits([{key:'mins',label:'Minuten'},{key:'secs',label:'Sekunden'}]);
      updateNum('mins', pad(mins));
      updateNum('secs', pad(secs));
    } else {
      // only seconds
      if(!document.getElementById('num-secs') || document.getElementById('num-mins')) buildUnits([{key:'secs',label:'Sekunden'}]);
      updateNum('secs', pad(secs));
    }

    // Progress bar: how far through the year are we?
    const yearStart = getYearStart();
    const yearEnd = ny;
    const yearTotal = yearEnd - yearStart;
    const yearElapsed = now - yearStart;
    const pct = Math.min(100, Math.max(0, (yearElapsed / yearTotal) * 100));
    progressBar.style.width = pct.toFixed(2) + '%';
    progressLabel.textContent = `Jahr zu ${pct.toFixed(1)}% verstrichen`;
  }

  // ---- FIREWORKS ----
  function resizeFw() {
    const app = document.getElementById('app');
    fwCanvas.width = app.offsetWidth;
    fwCanvas.height = app.offsetHeight;
  }

  function randomColor() {
    const cols = ['#ffe066','#ff6699','#66ccff','#aaff88','#ff9944','#cc88ff','#ffffff','#ffcc44'];
    return cols[Math.floor(Math.random()*cols.length)];
  }

  function launchRocket() {
    const x = 0.15*fwCanvas.width + Math.random()*0.7*fwCanvas.width;
    const targetY = 0.1*fwCanvas.height + Math.random()*0.45*fwCanvas.height;
    const color = randomColor();
    const count = 55 + Math.floor(Math.random()*35);
    for(let i=0;i<count;i++){
      const angle = (Math.PI*2*i/count) + (Math.random()-0.5)*0.3;
      const speed = 1.5 + Math.random()*4;
      particles.push({
        x, y: targetY,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        decay: 0.012 + Math.random()*0.018,
        color,
        size: 2 + Math.random()*2,
        trail: []
      });
    }
  }

  function animateFw() {
    if(!fireworksActive) return;
    ctx.fillStyle = 'rgba(5,6,15,0.18)';
    ctx.fillRect(0,0,fwCanvas.width,fwCanvas.height);

    for(let p of particles){
      p.trail.push({x:p.x,y:p.y,life:p.life});
      if(p.trail.length>6) p.trail.shift();
      // trail
      for(let t=0;t<p.trail.length;t++){
        const tl = p.trail[t];
        ctx.beginPath();
        ctx.arc(tl.x,tl.y,p.size*(t/p.trail.length)*0.7,0,Math.PI*2);
        ctx.fillStyle = p.color + Math.floor(tl.life*80).toString(16).padStart(2,'0');
        ctx.fill();
      }
      // particle
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle = p.color + Math.floor(p.life*255).toString(16).padStart(2,'0');
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06; // gravity
      p.vx *= 0.98;
      p.life -= p.decay;
    }
    particles = particles.filter(p=>p.life>0);
    animFrame = requestAnimationFrame(animateFw);
  }

  let launchInterval = null;
  function startFireworks() {
    fireworksActive = true;
    clearInterval(mainInterval);

    // Show HNY, hide counter
    counterWrap.style.display = 'none';
    fwCanvas.style.display = 'block';
    hny.style.display = 'flex';

    resizeFw();
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0,0,fwCanvas.width,fwCanvas.height);

    // Launch rockets periodically
    for(let i=0;i<5;i++) setTimeout(launchRocket, i*300);
    launchInterval = setInterval(launchRocket, 600);
    animateFw();

    // Reset next day
    scheduleReset();
  }

  function stopFireworks() {
    fireworksActive = false;
    clearInterval(launchInterval);
    cancelAnimationFrame(animFrame);
    particles = [];
    fwCanvas.style.display = 'none';
    hny.style.display = 'none';
    counterWrap.style.display = 'flex';
    ctx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
    buildUnits([{key:'days',label:'Tage'},{key:'hours',label:'Std'},{key:'mins',label:'Min'}]);
    tick();
    mainInterval = setInterval(tick, 1000);
  }

  function scheduleReset() {
    // Reset at next midnight (Jan 1 00:05 to be safe, or just after midnight)
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5, 0);
    const msUntil = tomorrow - now;
    setTimeout(stopFireworks, msUntil);
  }

  // Init
  buildUnits([{key:'days',label:'Tage'},{key:'hours',label:'Std'},{key:'mins',label:'Min'}]);
  tick();
  let mainInterval = setInterval(tick, 1000);

  window.addEventListener('resize', () => { if(fireworksActive) resizeFw(); });

  // no demo auto-start
})();
</script>
</body>
</html>
