<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year's Eve Countdown</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
    <ul class="background">
        <li></li>

    </ul>
    <main>
        <h1>Moritz' New Year Countdown</h1>
        <div id="countdown" class="countdown">
            <div class="countdown-item">
                <span id="days" class="countdown-value">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span id="hours" class="countdown-value">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span id="minutes" class="countdown-value">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span id="seconds" class="countdown-value">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>
        <div id="new-year-message" class="new-year-message hidden">
            <h2>Happy New Year!</h2>
        </div>
    </main>
    <canvas id="fireworks"></canvas>
    <script src="script.js"></script>
</body>
</html>
